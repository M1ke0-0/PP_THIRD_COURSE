[project]
name = "online-testing-backend"
version = "0.1.0"
description = "Backend системы онлайн-тестирования"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

